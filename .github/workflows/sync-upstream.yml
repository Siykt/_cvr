name: Sync Upstream
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add upstream
        run: |
          git remote add upstream https://github.com/clash-verge-rev/clash-verge-rev.git
          git fetch upstream

      - name: Merge update
        run: |
          git config user.name "GitHub Actions - Sync Upstream"
          git config user.email "actions@users.noreply.github.com"
          git switch main
          git merge upstream/main --allow-unrelated-histories
          git switch dev
          git merge upstream/dev --allow-unrelated-histories

      - name: Push origin
        run: |
          git push origin main
          git push origin dev
